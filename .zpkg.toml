[package]
org = "evento-globolo"
name = "evgl-leptos-web"
version = "0.1.0"
description = "Rust web server for Evento Globolo"
license = "MIT"
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/evento-globolo/evgl-leptos-web"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", "node_modules/**", "target/**", "dist/**", "*.log"]

[dependencies]
"evento-globolo/evgl-interfaces" = "^0.1.0"
"evento-globolo/evgl-libs" = "^0.1.0"
