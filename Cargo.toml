[package]
name = "evgl-leptos-web"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Leptos SSR + Axum + WebSocket comparison server for Evento Globolo."
repository = "https://github.com/evento-globolo/evgl-leptos-web"
publish = false

[dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
leptos = { version = "0.8", features = ["ssr"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
